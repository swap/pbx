[package]
name = "pbx-sdk"
version = "0.1.0"
edition = "2021"

[lib]
name = "pbx_sdk"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hkdf = "0.12"
hmac = "0.12"
prost = "0.13"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4"] }

[dependencies.axum]
version = "0.7"
optional = true

[dependencies.tower]
version = "0.5"
optional = true

[dependencies.actix-web]
version = "4"
optional = true

[features]
default = []
axum = ["dep:axum", "dep:tower"]
actix = ["dep:actix-web"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
